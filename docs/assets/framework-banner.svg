<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Cross-lingual bias detection</title>
  <desc id="desc">A multilingual research workflow: English, Italian and Persian prompts pass through six models to compare trait choices. Sixty scenarios per language, twelve domains, and four trait orientations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1229"/>
      <stop offset="1" stop-color="#132c46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#background)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <rect x="48" y="46" width="48" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="110" y="54" fill="#a5b4fc" font-size="14" font-weight="700" letter-spacing="2.5">MULTILINGUAL AI · REPRESENTATIONAL FAIRNESS</text>
    <text x="48" y="126" fill="#f8fafc" font-size="46" font-weight="700">Cross-lingual bias detection</text>
    <text x="48" y="165" fill="#cbd5e1" font-size="21">Same scenario. Three languages. How do trait choices change?</text>

    <g transform="translate(48 210)">
      <rect width="288" height="166" rx="16" fill="#132744" stroke="#3b82f6" stroke-opacity="0.7"/>
      <text x="20" y="32" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1.5">01 / PARALLEL PROMPTS</text>
      <text x="20" y="72" fill="#ffffff" font-size="24" font-weight="600">One task, three voices</text>
      <g transform="translate(20 97)">
        <rect width="72" height="42" rx="9" fill="#1e40af"/>
        <rect x="86" width="72" height="42" rx="9" fill="#1e40af"/>
        <rect x="172" width="72" height="42" rx="9" fill="#1e40af"/>
        <text x="36" y="28" text-anchor="middle" fill="#eff6ff" font-size="19" font-weight="700">EN</text>
        <text x="122" y="28" text-anchor="middle" fill="#eff6ff" font-size="19" font-weight="700">IT</text>
        <text x="208" y="28" text-anchor="middle" fill="#eff6ff" font-size="19" font-weight="700">FA</text>
      </g>
    </g>

    <path d="M 352 293 H 382" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(400 210)">
      <rect width="430" height="166" rx="16" fill="#251e49" stroke="#a78bfa" stroke-opacity="0.7"/>
      <text x="20" y="32" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1.5">02 / SIX MODEL CONFIGURATIONS</text>
      <text x="20" y="71" fill="#ffffff" font-size="23" font-weight="600">Generate or score a choice</text>
      <text x="20" y="109" fill="#ddd6fe" font-size="17">GPT-4o · Llama 3.1 70B · Llama 3.2</text>
      <text x="20" y="137" fill="#ddd6fe" font-size="17">Qwen2.5 14B · mBERT · XLM-R large</text>
    </g>

    <path d="M 846 293 H 876" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(894 210)">
      <rect width="338" height="166" rx="16" fill="#123a3e" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="20" y="32" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.5">03 / CROSS-LANGUAGE ANALYSIS</text>
      <text x="20" y="71" fill="#ffffff" font-size="23" font-weight="600">Align. Compare. Interpret.</text>
      <text x="20" y="109" fill="#ccfbf1" font-size="17">Agreement · Domain differences</text>
      <text x="20" y="137" fill="#ccfbf1" font-size="17">Choice entropy · Answer order</text>
    </g>

    <line x1="48" y1="408" x2="1232" y2="408" stroke="#475569" stroke-opacity="0.6"/>
    <text x="48" y="446" fill="#e2e8f0" font-size="16"><tspan fill="#7dd3fc" font-weight="700">60</tspan> scenarios / language</text>
    <text x="325" y="446" fill="#e2e8f0" font-size="16"><tspan fill="#c4b5fd" font-weight="700">12</tspan> domains</text>
    <text x="512" y="446" fill="#e2e8f0" font-size="16"><tspan fill="#5eead4" font-weight="700">4</tspan> trait orientations</text>
    <text x="1232" y="446" text-anchor="end" fill="#94a3b8" font-size="14">Original code · Saba Ghanbari Haez</text>
  </g>
</svg>
